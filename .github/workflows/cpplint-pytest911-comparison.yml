name: cpplint pytest 9.1.1 current Python 3.15.1 comparison
on:
  push:
    branches:
      - codex/cpplint-pytest911-comparison-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.os }} / ${{ matrix.mode }} / Python 3.15.1 pytest 9.1.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        mode: [baseline, patch]
    steps:
      - name: Checkout immutable upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cpplint/cpplint
          ref: 926bf4b5cfd979c951a933e75e615f54430e8d8a
          path: cpplint-src
          persist-credentials: false
      - name: Checkout immutable tested patch from user's own repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Csq57/ai-python-repository-stabilization-case-study
          ref: 8f5953644a88a38593975acc15a37ada7eac21a9
          path: proposal
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.1'
      - name: Confirm source identity and apply only in patch mode
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cd cpplint-src
          test "$(git rev-parse HEAD)" = "926bf4b5cfd979c951a933e75e615f54430e8d8a"
          python -c "import sys; assert sys.version_info[:3] == (3,15,1), sys.version; print(sys.version)"
          if test "$MODE" = patch; then
            git apply --check ../proposal/oss-proposals/cpplint-python315-commonpath.patch
            git apply ../proposal/oss-proposals/cpplint-python315-commonpath.patch
            git diff --check
            git diff --stat
            git diff --name-only
          else
            test "$MODE" = baseline
            test -z "$(git status --short)"
          fi
      - name: Install pinned pytest and test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet "pytest==9.1.1" "pytest-cov" "pytest-timeout" "testfixtures"
          python -c "import pytest; assert pytest.__version__ == '9.1.1', pytest.__version__; print('pytest',pytest.__version__)"
      - name: Run full pytest without warning suppression
        shell: bash
        working-directory: cpplint-src
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import pytest
          from pathlib import Path

          assert sys.version_info[:3] == (3,15,1)
          assert pytest.__version__ == "9.1.1"
          mode = os.environ["MODE"]
          assert mode in {"baseline", "patch"}
          program = Path("cpplint.py").read_text(encoding="utf-8")
          cmd = [sys.executable, "-m", "pytest", "-q", "--no-cov", "-o", "addopts="]
          run = subprocess.run(cmd, text=True, capture_output=True, check=False)
          stdout = run.stdout + "\n" + run.stderr
          failures = [x for x in stdout.splitlines() if x.startswith("FAILED ")]
          summaries = [x for x in stdout.splitlines() if re.search(r"\b\d+ (?:passed|failed)\b", x)][-5:]
          observed = {
              "mode": mode,
              "runner": os.environ.get("RUNNER_OS"),
              "python": sys.version.split()[0],
              "pytest": pytest.__version__,
              "exit_code": run.returncode,
              "full_suite_summary": summaries,
              "failed_cases": failures,
              "contains_commonprefix": "os.path.commonprefix(" in program,
              "commonprefix_deprecation_in_output": "os.path.commonprefix() is deprecated" in stdout,
              "source_sha": "926bf4b5cfd979c951a933e75e615f54430e8d8a",
              "patch_ref": "8f5953644a88a38593975acc15a37ada7eac21a9",
          }
          print("CPPLINT_PYTEST911_EVIDENCE", json.dumps(observed, sort_keys=True))
          print("--- unmodified actual pytest output tail ---")
          print(stdout[-10000:])
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as f:
                  f.write("### Python 3.15.1 / pytest 9.1.1 / "+mode+"\n")
                  f.write("~~~json\n"+json.dumps(observed, indent=2)+"\n~~~\n")
          if not summaries:
              raise SystemExit("No pytest result summary available")
          # The original 4 CLI output failures remain explicitly reported.
          # Only the patch result is required to be green.
          if mode=="patch" and run.returncode != 0:
              raise SystemExit("Patch has not passed full pytest")
          if mode=="baseline" and run.returncode not in (0,1):
              raise SystemExit("Baseline didn't run normally")
          PY
