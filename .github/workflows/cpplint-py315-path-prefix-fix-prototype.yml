name: cpplint Python 3.15 path-prefix fix prototype
on:
  push:
    branches:
      - codex/cpplint-commonprefix-prototype-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13', '3.14', '3.15.1']
    steps:
      - name: Checkout exact public upstream cpplint source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cpplint/cpplint
          ref: 926bf4b5cfd979c951a933e75e615f54430e8d8a
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Apply temporary source-only prototype and regression tests
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import textwrap
          import sys

          expected = "926bf4b5cfd979c951a933e75e615f54430e8d8a"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == expected, (actual, expected)
          print("Pinned commit:", expected, "Python:", sys.version)

          source_file = pathlib.Path("cpplint.py")
          source = source_file.read_text(encoding="utf8")
          ancestor_snippet = "os.path.commonprefix([root_dir, project_dir])"
          assert source.count(ancestor_snippet) == 2, source.count(ancestor_snippet)
          source = source.replace(ancestor_snippet, "os.path.commonpath([root_dir, project_dir])")
          old_lines = [
              "    prefix = os.path.commonprefix([parent, child])",
              "    if prefix != parent:",
              "        return False",
              "    # Note: os.path.commonprefix operates on character basis, so",
              "    # take extra care of situations like '/foo/ba' and '/foo/bar/baz'",
              "    child_suffix = child[len(prefix) :]",
              "    child_suffix = child_suffix.lstrip(os.sep)",
              "    return child == os.path.join(prefix, child_suffix)",
          ]
          old = "\n".join(old_lines) + "\n"
          new_lines = [
              "    # Compare complete path components rather than character prefixes.",
              "    try:",
              "        return os.path.commonpath([parent, child]) == parent",
              "    except ValueError:",
              "        # Windows paths on different drives have no common ancestor.",
              "        return False",
          ]
          new = "\n".join(new_lines) + "\n"
          assert source.count(old) == 1, f"Expected one helper, got {source.count(old)}"
          source = source.replace(old, new)
          assert "os.path.commonprefix(" not in source
          source_file.write_text(source, encoding="utf8")

          tests_file = pathlib.Path("cpplint_unittest.py")
          tests = tests_file.read_text(encoding="utf8")
          marker = '\nif __name__ == "__main__":\n    pytest.main([__file__])'
          assert tests.count(marker) == 1
          extra_tests = r'''
          def test_is_parent_or_same_uses_complete_path_components(tmp_path):
              root = tmp_path / "repo"
              assert cpplint._IsParentOrSame(str(root), str(root))
              assert cpplint._IsParentOrSame(str(root), str(root / "sub" / "source.cc"))
              assert cpplint._IsParentOrSame(str(root), str(root / "sub" / ".." / "README.md"))
              assert not cpplint._IsParentOrSame(str(root), str(tmp_path / "repository" / "x.h"))
              assert not cpplint._IsParentOrSame(str(root), str(root / ".." / "elsewhere" / "x.h"))
              assert not cpplint._IsParentOrSame(str(root / "sub"), str(root))
              if os.name == "nt":
                  assert not cpplint._IsParentOrSame(r"C:\repo", r"D:\repo\foo.cc")
                  assert cpplint._IsParentOrSame(r"C:\Repo", r"c:\repo\sub\foo.cc")


          @pytest.mark.parametrize(("metadata", "legacy_svn"), [
              (".git", False),
              (".hg", False),
              (".svn", False),
              (".svn", True),
          ])
          def test_file_info_repository_name_without_commonprefix(
              tmp_path, monkeypatch, metadata, legacy_svn
          ):
              monkeypatch.setattr(cpplint, "_repository", None)
              root = tmp_path / "repo"
              source_dir = root / "src"
              source_dir.mkdir(parents=True)
              (root / metadata).mkdir()
              if legacy_svn:
                  (source_dir / ".svn").mkdir()
              source = source_dir / "example.h"
              source.write_text("", encoding="utf-8")
              assert cpplint.FileInfo(str(source)).RepositoryName() == "src/example.h"
          '''
          extra_tests = textwrap.dedent(extra_tests)
          tests_file.write_text(tests.replace(marker, "\n\n"+extra_tests+marker), encoding="utf8")

          changelog = pathlib.Path("CHANGELOG.rst")
          cl = changelog.read_text(encoding="utf8")
          heading = "TBA\n===\n\n"
          assert cl.count(heading) == 1
          entry = "* Use path-aware prefix checks instead of deprecated os.path.commonprefix(). (#445)\n"
          cl = cl.replace(heading, heading + entry, 1)
          changelog.write_text(cl, encoding="utf8")
          print("Prototype replacements: 3 calls, 2 test functions (5 test cases)")
          PY
          git diff --check
          git diff --stat
          git diff -- cpplint.py cpplint_unittest.py CHANGELOG.rst
      - name: Install isolated test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet "pytest==9.0.3" "pytest-cov" "pytest-timeout" "testfixtures"
          python -m pytest --version
      - name: Run full suite with commonprefix deprecations treated as errors
        shell: bash
        env:
          PYTHONWARNINGS: "error:os.path.commonprefix() is deprecated:DeprecationWarning"
        run: |
          python -m pytest -q --no-cov -o addopts=
