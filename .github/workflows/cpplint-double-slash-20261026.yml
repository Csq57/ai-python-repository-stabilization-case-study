name: cpplint Python 3.15 double-slash regression verification
on:
  push:
    branches:
      - codex/cpplint-double-slash-verification-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13', '3.14', '3.15.1']
    steps:
      - name: Checkout pinned candidate from user-owned cpplint Fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Csq57/cpplint
          ref: a959d1d8e35e18551040abd3dda8b72232bfdfef
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exact patch source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a959d1d8e35e18551040abd3dda8b72232bfdfef"
          python --version
          python - <<'PY'
          from pathlib import Path
          source = Path("cpplint.py").read_text(encoding="utf-8")
          tests = Path("cpplint_unittest.py").read_text(encoding="utf-8")
          assert "os.path.commonprefix(" not in source
          assert source.count("os.path.relpath(fullname, root_dir)") == 1
          assert source.count("pathlib.PurePath(fullname).relative_to(root_dir)") == 2
          assert "os.path.commonpath([parent, child]) == os.path.commonpath([parent])" in source
          assert "test_is_parent_or_same_double_slash_root" in tests
          assert "test_double_slash_repository_name" in tests
          PY
          git diff --check
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet "pytest==9.1.1" "pytest-cov" "pytest-timeout" "testfixtures"
          python -c "import pytest; assert pytest.__version__ == '9.1.1'; print(pytest.__version__)"
      - name: Run full test suite without deprecation warning suppression
        shell: bash
        env:
          PYTHONWARNINGS: "error:os.path.commonprefix() is deprecated:DeprecationWarning"
        run: |
          python -m pytest -q --no-cov -o addopts=
      - name: Upstream coverage and quality gates
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet ".[dev]" pre-commit
          python -m pytest -q
          python -m pylint cpplint.py
          python -m mypy cpplint.py cpplint_clitest.py cpplint_unittest.py
          pre-commit run --all-files
