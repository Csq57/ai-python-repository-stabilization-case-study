name: Repository health tool tests
on:
  push:
    paths:
      - 'tools/repo_health_check.py'
      - 'tests/test_repo_health_check.py'
      - '.github/workflows/repo-health-check.yml'
  pull_request:
    paths:
      - 'tools/repo_health_check.py'
      - 'tests/test_repo_health_check.py'
      - '.github/workflows/repo-health-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_repo_health_check.py' -v
      - name: Show inventory (not a quality gate)
        run: python tools/repo_health_check.py . --format text
