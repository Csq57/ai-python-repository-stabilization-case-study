# This workflow is a cross-repository consumer test, not evidence of third-party adoption.
# It is intentionally restricted to a separate test branch.
name: Cross-repository Repo Health Action smoke
on:
  push:
    branches: [codex/repo-health-consumer-smoke-20261023]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this independent test repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Call pinned external Action without failing on expected warnings
        uses: Csq57/repo-health-check@da5d2ad23f9c72b2c5d9f1032c3eb4057129ec2e
        with:
          path: .
          format: json
          fail-on: none
          redact-root: 'true'
      - name: Check that warning gating fails in strict mode
        id: strict
        continue-on-error: true
        uses: Csq57/repo-health-check@da5d2ad23f9c72b2c5d9f1032c3eb4057129ec2e
        with:
          path: .
          format: text
          fail-on: warning
          redact-root: 'true'
      - name: Assert strict mode detected the expected missing maintenance files
        shell: bash
        env:
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
        run: |
          if [ "$STRICT_OUTCOME" != "failure" ]; then
            echo "Strict mode was expected to fail for this intentionally incomplete sample repository." >&2
            exit 1
          fi
          echo "Expected strict-mode gate failure observed."
