# Independent, maintainer-run verification of public cpplint source.
# Explicitly not a cpplint upstream workflow or a release.
name: cpplint Issue 445 - current Python 3.15.1
on:
  push:
    branches:
      - codex/cpplint-py3151-maintainer-request-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: "${{ matrix.source.label }} / ${{ matrix.os }} / Python 3.15.1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        source:
          - label: release-2.0.2
            sha: 350702a4d39395571bd118c9a3cff0a573488d61
          - label: develop-fixed-20261023
            sha: 926bf4b5cfd979c951a933e75e615f54430e8d8a
    steps:
      - name: Checkout exact public cpplint source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cpplint/cpplint
          ref: ${{ matrix.source.sha }}
          persist-credentials: false
      - name: Set up exact Python 3.15.1
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.1'
      - name: Verify immutable source and exact interpreter
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.source.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -c "import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version; print(sys.version)"
          git log -1 --format='%H %s'
      - name: Install Python test requirements
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet "pytest==9.0.3" "pytest-cov" "pytest-timeout" "testfixtures"
          python -m pytest --version
      - name: Run targeted and complete pytest suites without coverage gate
        shell: bash
        env:
          CPPLINT_SOURCE_LABEL: ${{ matrix.source.label }}
          CPPLINT_EXPECTED_SHA: ${{ matrix.source.sha }}
          CPPLINT_RUNNER_OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import re
          import subprocess
          import sys
          from pathlib import Path

          if sys.version_info[:3] != (3, 15, 1):
              raise SystemExit(f"Wrong Python version: {sys.version!r}")
          source = Path("cpplint.py").read_text(encoding="utf-8")
          base = [sys.executable, "-m", "pytest", "-q", "--no-cov", "-o", "addopts="]
          cases = {
              "targeted": base + ["cpplint_unittest.py::TestQuiet::testQuietWithoutErrors"],
              "full": base,
          }
          results = {}
          for label, command in cases.items():
              process = subprocess.run(command, capture_output=True, text=True, check=False)
              out = process.stdout + "\n" + process.stderr
              # Always preserve human-readable failure names and actual pytest summary.
              failed_cases = [
                  line.strip() for line in out.splitlines()
                  if line.startswith(("FAILED ", "ERROR "))
              ]
              summary_lines = [
                  line.strip() for line in out.splitlines()
                  if re.search(r"\b(?:\d+ failed|\d+ passed|\d+ errors?|\d+ skipped)\b", line)
              ][-8:]
              results[label] = {
                  "exit_code": process.returncode,
                  "pytest_summary": summary_lines,
                  "failed_cases": failed_cases,
                  "mentions_codecs_open_deprecation": "codecs.open() is deprecated" in out,
                  "mentions_called_process_error": "CalledProcessError" in out,
                  "collected_test_count_known": "collected" in out or bool(summary_lines),
              }
              print("CPPLINT_3151_TEST", json.dumps({
                  "suite": label,
                  "source": os.environ["CPPLINT_SOURCE_LABEL"],
                  "runner": os.environ["CPPLINT_RUNNER_OS"],
                  "python": sys.version.split()[0],
                  **results[label],
              }, sort_keys=True))
              if process.returncode:
                  # A failing published release is expected. Do not mask it in
                  # the reported raw outcomes or confuse harness success with test success.
                  print(f"--- {label} failure log tail (max 18000 characters) ---")
                  print(out[-18000:])
              elif label == "full":
                  print(out[-2200:])

          evidence = {
              "source_label": os.environ["CPPLINT_SOURCE_LABEL"],
              "source_sha": os.environ["CPPLINT_EXPECTED_SHA"],
              "python": sys.version.split()[0],
              "runner": os.environ["CPPLINT_RUNNER_OS"],
              "source_contains_codecs_open": "codecs.open(" in source,
              "results": results,
              "limitations": [
                  "Independent maintainer-run GitHub-hosted CI on public source.",
                  "No test coverage gate, release signing, or release publishing.",
                  "Only pytest 9.0.3 is explicitly pinned among Python test dependencies.",
              ],
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## cpplint Issue #445 — Python 3.15.1\n")
              summary.write("This is an independent comparison; the old release may fail.\n\n")
              summary.write("~~~json\n" + json.dumps(evidence, indent=2) + "\n~~~\n")
          print("CPPLINT_3151_FINAL", json.dumps(evidence, sort_keys=True))
          # CI is a comparison harness. Upstream develop regressions fail this
          # job, while test failures in the old release stay visible as evidence.
          if any(r["exit_code"] not in (0, 1) or not r["collected_test_count_known"] for r in results.values()):
              raise SystemExit("Pytest did not run normally or no test summary was collected")
          if os.environ["CPPLINT_SOURCE_LABEL"].startswith("develop"):
              if any(r["exit_code"] != 0 for r in results.values()):
                  raise SystemExit("Potential Python 3.15.1 regression in develop")
          PY
      - name: "Diagnostic only: isolate os.path.commonprefix() warning"
        # An intentionally narrow warning filter, not a production fix.
        # Run even if the preceding development full-suite check fails,
        # to test whether this warning alone explains the discrepancies.
        if: ${{ always() && matrix.source.label == 'develop-fixed-20261023' }}
        env:
          PYTHONWARNINGS: 'ignore:os.path.commonprefix() is deprecated:DeprecationWarning'
        shell: bash
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 15, 1)"
          python -m pytest -q --no-cov -o addopts=
