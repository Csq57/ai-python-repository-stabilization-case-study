<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bounded AI-assisted development workflow</title>
  <desc id="desc">A seven-stage workflow from baseline to handover, surrounded by scope and safety boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#12344a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49d3b4"/>
      <stop offset="1" stop-color="#52a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="84" r="170" fill="#1d5772" opacity="0.22"/>
  <circle cx="85" cy="590" r="210" fill="#167060" opacity="0.18"/>
  <text x="72" y="88" fill="#f2f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">AI-assisted change, bounded by evidence</text>
  <text x="72" y="127" fill="#a9c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="20">A reusable Python repository stabilisation sequence</text>
  <rect x="60" y="170" width="1080" height="330" rx="26" fill="#0d2636" stroke="url(#accent)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="208" fill="#7ee9cf" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">AGREED SCOPE + PROTECTED BEHAVIOUR</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(90 252)">
      <rect width="125" height="104" rx="16" fill="#173f50"/>
      <text x="62.5" y="44" text-anchor="middle" fill="#f5fbfd" font-size="18" font-weight="700">Baseline</text>
      <text x="62.5" y="71" text-anchor="middle" fill="#adc7d2" font-size="14">Known state</text>
    </g>
    <path d="M220 304h34" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round"/>
    <path d="M247 296l10 8-10 8" fill="none" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(266 252)">
      <rect width="125" height="104" rx="16" fill="#173f50"/>
      <text x="62.5" y="44" text-anchor="middle" fill="#f5fbfd" font-size="18" font-weight="700">Boundaries</text>
      <text x="62.5" y="71" text-anchor="middle" fill="#adc7d2" font-size="14">Non-goals</text>
    </g>
    <path d="M396 304h34" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round"/>
    <path d="M423 296l10 8-10 8" fill="none" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(442 252)">
      <rect width="125" height="104" rx="16" fill="#173f50"/>
      <text x="62.5" y="44" text-anchor="middle" fill="#f5fbfd" font-size="18" font-weight="700">Reproduce</text>
      <text x="62.5" y="71" text-anchor="middle" fill="#adc7d2" font-size="14">Run commands</text>
    </g>
    <path d="M572 304h34" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round"/>
    <path d="M599 296l10 8-10 8" fill="none" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(618 252)">
      <rect width="125" height="104" rx="16" fill="#173f50"/>
      <text x="62.5" y="44" text-anchor="middle" fill="#f5fbfd" font-size="18" font-weight="700">Evidence</text>
      <text x="62.5" y="71" text-anchor="middle" fill="#adc7d2" font-size="14">Rank risks</text>
    </g>
    <path d="M748 304h34" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round"/>
    <path d="M775 296l10 8-10 8" fill="none" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(794 252)">
      <rect width="125" height="104" rx="16" fill="#173f50"/>
      <text x="62.5" y="37" text-anchor="middle" fill="#f5fbfd" font-size="17" font-weight="700">Bounded</text>
      <text x="62.5" y="60" text-anchor="middle" fill="#f5fbfd" font-size="17" font-weight="700">change</text>
      <text x="62.5" y="84" text-anchor="middle" fill="#adc7d2" font-size="14">Small patch</text>
    </g>
    <path d="M924 304h34" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round"/>
    <path d="M951 296l10 8-10 8" fill="none" stroke="#5cc9dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(970 252)">
      <rect width="125" height="104" rx="16" fill="url(#accent)"/>
      <text x="62.5" y="37" text-anchor="middle" fill="#062436" font-size="17" font-weight="800">Verify +</text>
      <text x="62.5" y="60" text-anchor="middle" fill="#062436" font-size="17" font-weight="800">handover</text>
      <text x="62.5" y="84" text-anchor="middle" fill="#123a4b" font-size="14" font-weight="600">Dated proof</text>
    </g>
  </g>
  <line x1="90" y1="405" x2="1095" y2="405" stroke="#315569" stroke-width="1"/>
  <text x="90" y="445" fill="#d9e8ed" font-family="Segoe UI, Arial, sans-serif" font-size="18">Acceptance rule:</text>
  <text x="238" y="445" fill="#82e7d1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">a persuasive answer is not completion; reproducible checks are.</text>
  <g transform="translate(72 545)" font-family="Segoe UI, Arial, sans-serif">
    <circle cx="8" cy="0" r="7" fill="#49d3b4"/>
    <text x="25" y="7" fill="#bdd1da" font-size="17">Scope</text>
    <circle cx="125" cy="0" r="7" fill="#52a8ff"/>
    <text x="142" y="7" fill="#bdd1da" font-size="17">Tests</text>
    <circle cx="229" cy="0" r="7" fill="#f2c76e"/>
    <text x="246" y="7" fill="#bdd1da" font-size="17">Failure behaviour</text>
    <circle cx="420" cy="0" r="7" fill="#ef88a7"/>
    <text x="437" y="7" fill="#bdd1da" font-size="17">Privacy</text>
    <circle cx="526" cy="0" r="7" fill="#a58bfa"/>
    <text x="543" y="7" fill="#bdd1da" font-size="17">Handover</text>
  </g>
</svg>
