<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sanitised repository control map</title>
  <desc id="desc">Conceptual repository layers connected to verification gates without showing private source structure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e8f2f5"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b54"/>
      <stop offset="1" stop-color="#0d2739"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16394a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <text x="70" y="82" fill="#102f43" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Repository controls, not repository exposure</text>
  <text x="70" y="120" fill="#537080" font-family="Segoe UI, Arial, sans-serif" font-size="19">A conceptual map of protected engineering contracts</text>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(65 175)">
      <rect width="250" height="96" rx="18" fill="#ffffff"/>
      <rect width="8" height="96" rx="4" fill="#36b99a"/>
      <text x="30" y="41" fill="#17384a" font-size="20" font-weight="700">Interfaces</text>
      <text x="30" y="68" fill="#617b88" font-size="15">CLI, package, dashboard</text>
    </g>
    <g transform="translate(65 290)">
      <rect width="250" height="96" rx="18" fill="#ffffff"/>
      <rect width="8" height="96" rx="4" fill="#4f9ee8"/>
      <text x="30" y="41" fill="#17384a" font-size="20" font-weight="700">Deterministic core</text>
      <text x="30" y="68" fill="#617b88" font-size="15">Calculations and schemas</text>
    </g>
    <g transform="translate(65 405)">
      <rect width="250" height="96" rx="18" fill="#ffffff"/>
      <rect width="8" height="96" rx="4" fill="#efb44d"/>
      <text x="30" y="41" fill="#17384a" font-size="20" font-weight="700">Side effects</text>
      <text x="30" y="68" fill="#617b88" font-size="15">Providers, files, publication</text>
    </g>
    <g transform="translate(475 218)">
      <rect width="250" height="240" rx="24" fill="url(#navy)"/>
      <text x="125" y="55" text-anchor="middle" fill="#7de3cc" font-size="16" font-weight="700" letter-spacing="1">BOUNDED TASK</text>
      <line x1="42" y1="75" x2="208" y2="75" stroke="#466778"/>
      <text x="125" y="116" text-anchor="middle" fill="#f4fafc" font-size="20" font-weight="700">Allowed scope</text>
      <text x="125" y="149" text-anchor="middle" fill="#f4fafc" font-size="20" font-weight="700">Explicit non-goals</text>
      <text x="125" y="182" text-anchor="middle" fill="#f4fafc" font-size="20" font-weight="700">Protected behaviour</text>
      <text x="125" y="215" text-anchor="middle" fill="#a8c2ce" font-size="15">Objective completion evidence</text>
    </g>
    <g transform="translate(885 175)">
      <rect width="250" height="96" rx="18" fill="#ffffff"/>
      <rect x="242" width="8" height="96" rx="4" fill="#36b99a"/>
      <text x="25" y="41" fill="#17384a" font-size="20" font-weight="700">Behaviour checks</text>
      <text x="25" y="68" fill="#617b88" font-size="15">Unit, integration and CLI</text>
    </g>
    <g transform="translate(885 290)">
      <rect width="250" height="96" rx="18" fill="#ffffff"/>
      <rect x="242" width="8" height="96" rx="4" fill="#4f9ee8"/>
      <text x="25" y="41" fill="#17384a" font-size="20" font-weight="700">Delivery checks</text>
      <text x="25" y="68" fill="#617b88" font-size="15">Build and clean install</text>
    </g>
    <g transform="translate(885 405)">
      <rect width="250" height="96" rx="18" fill="#ffffff"/>
      <rect x="242" width="8" height="96" rx="4" fill="#efb44d"/>
      <text x="25" y="41" fill="#17384a" font-size="20" font-weight="700">Boundary checks</text>
      <text x="25" y="68" fill="#617b88" font-size="15">Failure, privacy and safety</text>
    </g>
  </g>
  <g stroke="#6c8997" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M315 223C390 223 410 270 475 270"/>
    <path d="M315 338H475"/>
    <path d="M315 453C390 453 410 405 475 405"/>
    <path d="M725 270C790 270 810 223 885 223"/>
    <path d="M725 338H885"/>
    <path d="M725 405C790 405 810 453 885 453"/>
  </g>
  <text x="600" y="557" text-anchor="middle" fill="#476673" font-family="Segoe UI, Arial, sans-serif" font-size="17">Only concepts and dated evidence are public; product source remains private.</text>
</svg>
