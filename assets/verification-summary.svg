<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenTrendIQ Lite verification summary</title>
  <desc id="desc">Dated engineering evidence showing tests, build, clean wheel and continuous integration results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a28"/>
      <stop offset="1" stop-color="#163b4d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78e2c7"/>
      <stop offset="1" stop-color="#36b998"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <text x="70" y="85" fill="#f4fafc" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="700">Dated engineering evidence</text>
  <text x="70" y="125" fill="#a9c2ce" font-family="Segoe UI, Arial, sans-serif" font-size="20">OpenTrendIQ Lite 1.0.0 · verified 18 July 2026</text>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 180)">
      <rect width="500" height="140" rx="22" fill="#102d3d" stroke="#2f5365"/>
      <circle cx="64" cy="70" r="31" fill="url(#green)"/>
      <path d="M49 70l10 11 21-25" fill="none" stroke="#0b3040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="55" fill="#f3f9fb" font-size="24" font-weight="700">Full test suite</text>
      <text x="120" y="93" fill="#79dfc8" font-size="27" font-weight="700">693 passed</text>
      <text x="302" y="93" fill="#afc7d1" font-size="17">2 skipped · 1 warning</text>
    </g>
    <g transform="translate(630 180)">
      <rect width="500" height="140" rx="22" fill="#102d3d" stroke="#2f5365"/>
      <circle cx="64" cy="70" r="31" fill="url(#green)"/>
      <path d="M49 70l10 11 21-25" fill="none" stroke="#0b3040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="55" fill="#f3f9fb" font-size="24" font-weight="700">Package build</text>
      <text x="120" y="93" fill="#79dfc8" font-size="22" font-weight="700">Wheel + source distribution</text>
    </g>
    <g transform="translate(70 360)">
      <rect width="500" height="140" rx="22" fill="#102d3d" stroke="#2f5365"/>
      <circle cx="64" cy="70" r="31" fill="url(#green)"/>
      <path d="M49 70l10 11 21-25" fill="none" stroke="#0b3040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="55" fill="#f3f9fb" font-size="24" font-weight="700">Clean-wheel smoke</text>
      <text x="120" y="93" fill="#79dfc8" font-size="22" font-weight="700">Module + console entry succeeded</text>
    </g>
    <g transform="translate(630 360)">
      <rect width="500" height="140" rx="22" fill="#102d3d" stroke="#2f5365"/>
      <circle cx="64" cy="70" r="31" fill="url(#green)"/>
      <path d="M49 70l10 11 21-25" fill="none" stroke="#0b3040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="55" fill="#f3f9fb" font-size="24" font-weight="700">Latest master CI</text>
      <text x="120" y="93" fill="#79dfc8" font-size="22" font-weight="700">Successful</text>
      <text x="245" y="93" fill="#afc7d1" font-size="17">Windows + Ubuntu matrix</text>
    </g>
  </g>
  <text x="70" y="568" fill="#a9c2ce" font-family="Segoe UI, Arial, sans-serif" font-size="17">Repository verification only · no claim about investment or customer outcomes</text>
</svg>
